name: Release

# Triggers automatically on push to main, or manually via workflow_dispatch
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────
  # 1. Determine & push the next version tag
  # ─────────────────────────────────────────
  tag:
    name: Auto Tag Version
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
      prev_tag: ${{ steps.version.outputs.prev_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Get the latest tag (fallback to v1.0.0 if no tags found)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "prev_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          # Extract Major.Minor.Patch numbers
          CLEAN_VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          # Check commit message for bump hints
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qi "#major"; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif echo "$COMMIT_MSG" | grep -qi "#minor"; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Bumping version from $LATEST_TAG to $NEW_TAG"

          # Create and push the new git tag
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

  # ─────────────────────────────────────────
  # 2. Build both artefacts
  # ─────────────────────────────────────────
  build:
    name: Build Artefacts
    needs: tag
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.tag.outputs.new_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── Client ──────────────────────────
      - name: Install client dependencies
        working-directory: client
        run: pnpm install --no-frozen-lockfile

      - name: Lint client
        working-directory: client
        run: pnpm lint

      - name: Build client
        working-directory: client
        run: pnpm build
        env:
          VITE_APP_VERSION: ${{ env.TAG_NAME }}

      - name: Archive client dist
        run: tar -czf smilux-client-${{ env.TAG_NAME }}.tar.gz -C client dist/

      # ── Server ──────────────────────────
      - name: Install server dependencies
        working-directory: server
        run: pnpm install --no-frozen-lockfile

      - name: Lint server
        working-directory: server
        run: pnpm lint

      - name: Archive server source
        run: |
          tar \
            --exclude='server/node_modules' \
            --exclude='server/.env' \
            -czf smilux-server-${{ env.TAG_NAME }}.tar.gz server/

      # ── Upload for the release job ───────
      - name: Upload release artefacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artefacts
          path: |
            smilux-client-${{ env.TAG_NAME }}.tar.gz
            smilux-server-${{ env.TAG_NAME }}.tar.gz

  # ─────────────────────────────────────────
  # 3. Create GitHub Release
  # ─────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [tag, build]
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.tag.outputs.new_tag }}
      PREV_TAG: ${{ needs.tag.outputs.prev_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artefacts
        uses: actions/download-artifact@v4
        with:
          name: release-artefacts

      # Mark as pre-release when tag contains a hyphen (e.g. v1.0.0-beta.1)
      - name: Detect pre-release
        id: pre
        run: |
          if [[ "${{ env.TAG_NAME }}" == *"-"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Auto-generate changelog from commits since the previous tag
      - name: Generate changelog
        id: changelog
        run: |
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          fi
          if [ -z "$LOG" ]; then
            LOG="- Automated release for ${{ env.TAG_NAME }}"
          fi
          echo "$LOG" > CHANGELOG_FRAGMENT.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Smilux ${{ env.TAG_NAME }}"
          body_path: CHANGELOG_FRAGMENT.md
          prerelease: ${{ steps.pre.outputs.is_prerelease }}
          files: |
            smilux-client-${{ env.TAG_NAME }}.tar.gz
            smilux-server-${{ env.TAG_NAME }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
